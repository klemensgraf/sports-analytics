name: Run Dagger publish pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
  REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
  REGISTRY_URL: ${{ vars.REGISTRY_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

jobs:
  dagger-publish-main:
    name: Run Dagger Publish on Merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: "write"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Dagger publish pipeline
        id: dagger-publish
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "latest"
          args: publish --github-token=env://GITHUB_TOKEN --registry-token=env://REGISTRY_TOKEN --registry-username=$REGISTRY_USERNAME --registry-url=$REGISTRY_URL --branch-name=$GITHUB_REF_NAME
          cloud-token: ${{ env.DAGGER_CLOUD_TOKEN }}

  dagger-publish-prs:
    name: Run Dagger Publish on Pull Requests
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: "read"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Dagger Publish pipeline (for PRs)
        id: dagger-publish
        if: ${{ env.REGISTRY_TOKEN != '' }}
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "latest"
          args: publish --registry-token=env://REGISTRY_TOKEN --registry-username=$REGISTRY_USERNAME --registry-url=$REGISTRY_URL --branch-name=$GITHUB_HEAD_REF
          cloud-token: ${{ env.DAGGER_CLOUD_TOKEN }}
