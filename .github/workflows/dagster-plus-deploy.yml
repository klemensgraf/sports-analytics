name: Dagster Cloud Hybrid Deployment
on:
  push: # For full deployments
    branches:
      - "main"
  pull_request: # For branch deployments
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  # Cancel in-progress deploys to the same branch
  group: ${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DAGSTER_CLOUD_ORGANIZATION: ${{ vars.DAGSTER_CLOUD_ORGANIZATION }}
  DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
  DAGSTER_PROJECT_DIR: ${{ vars.DAGSTER_PROJECT_DIR }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY_URL: ${{ vars.REGISTRY_URL }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  DBT_TARGET: ${{ vars.DBT_TARGET }}
  CODE_LOCATION_NAME: ${{ vars.CODE_LOCATION_NAME }}

jobs:
  dagster-cloud-deploy:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      # If this is a closed PR the prerun step closes the branch deployment and returns
      # output.result='skip' which is used to skip other steps in this workflow.
      - name: Pre-run checks
        id: prerun
        uses: dagster-io/dagster-cloud-action/actions/utils/prerun@v1.12.13

      - name: Checkout
        uses: actions/checkout@v4
        if: steps.prerun.outputs.result != 'skip'
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Detect if this is branch deployment and initialize the build session
      - name: Initialize build session
        id: ci-init
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-deploy-init@v1.12.13
        with:
          project_dir: ${{ env.DAGSTER_PROJECT_DIR }}
          # A full deployment name. If this run is for a pull request, this value will be used as
          # the base deployment for the branch deployment.
          deployment: "prod"

      # Ensure the correct Python version is installed
      - name: Set up Python ${{ env.PYTHON_VERSION }} for target
        id: setup-python-version
        if: steps.prerun.outputs.result != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.prerun.outputs.result != 'skip'
        run: ${{ steps.setup-python-version.outputs.python-path }} -m pip install uv
        shell: bash

      # Sync all projects (workspace or single project)
      - name: Sync project dependencies
        if: steps.prerun.outputs.result != 'skip'
        run: |
          cd ${{ env.DAGSTER_PROJECT_DIR }}
          for project in $(${{ steps.setup-python-version.outputs.python-path }} -m uv run dg list projects); do
            (cd "$project" && ${{ steps.setup-python-version.outputs.python-path }} -m uv sync)
          done
        shell: bash

      # Refresh state for any StateBackedComponents in the project
      - name: Refresh defs state
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.12.13
        with:
          command: "plus deploy refresh-defs-state"

      # Any value can be used as the docker image tag. It is recommended to use a unique value
      # for each build so that multiple builds do not overwrite each other.
      - name: Generate docker image tag
        id: generate-image-tag
        if: steps.prerun.outputs.result != 'skip'
        run: |
          IMAGE_TAG="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Generated image tag: $IMAGE_TAG"

      # Enable buildx for caching
      - name: Set up Docker Buildx
        if: steps.prerun.outputs.result != 'skip'
        uses: docker/setup-buildx-action@v3

      # Login to the container registry
      # https://github.com/docker/login-action#github-container-registry
      - name: Login to GitHub Container Registry
        if: steps.prerun.outputs.result != 'skip'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # For each code location, the "build-push-action" builds the docker
      # image and a "set-build-output" command records the image tag for each code location.
      - name: Build and upload Docker image for "${{ env.CODE_LOCATION_NAME }}"
        if: steps.prerun.outputs.result != 'skip'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_URL }}:${{ env.IMAGE_TAG }}-${{ env.CODE_LOCATION_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update build session with image tag for ${{ env.CODE_LOCATION_NAME }}
        id: ci-set-build-output-example-location
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.12.13
        with:
          command: "plus deploy set-build-output --target-path=${{ env.DAGSTER_PROJECT_DIR }} --location-name=${{ env.CODE_LOCATION_NAME }} --image-tag=${{ env.IMAGE_TAG }}-${{ env.CODE_LOCATION_NAME }}"


      # Deploy all code locations in this build session to Dagster Cloud
      - name: Deploy to Dagster Cloud
        id: ci-deploy
        if: steps.prerun.outputs.result != 'skip'
        uses: dagster-io/dagster-cloud-action/actions/utils/dg-cli@v1.12.13
        with:
          command: "plus deploy finish --target-path=${{ env.DAGSTER_PROJECT_DIR }}"

      # Update a PR comment - this runs always() so the comment is updated on success and failure
      - name: Update PR comment for branch deployments
        id: ci-notify
        if: steps.prerun.outputs.result != 'skip' && always()
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.12.13
        with:
          command: "ci notify --project-dir=${{ env.DAGSTER_PROJECT_DIR }}"

      # Generate a summary that shows up on the Workflow Summary page
      - name: Generate a summary
        id: ci-summary
        if: steps.prerun.outputs.result != 'skip' && always()
        uses: dagster-io/dagster-cloud-action/actions/utils/dagster-cloud-cli@v1.12.13
        with:
          command: "ci status --output-format=markdown >> $GITHUB_STEP_SUMMARY"

  # Execute docker build on dependabot pull requests
  dependabot-smoke:
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: local/dependabot-smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
