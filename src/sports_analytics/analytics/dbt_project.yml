name: "analytics"
require-dbt-version: [">=1.0.0", "<2.0.0"]
version: "1.0.0"

profile: "analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
