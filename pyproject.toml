[project]
name = "sports_analytics"
requires-python = ">=3.12,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.10",
    "dagster-cloud>=1.12.10",
    "dagster-duckdb>=0.28.10",
    "dagster-duckdb-pandas>=0.28.10",
    "duckdb>=1.4.3",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "ruff>=0.14.11",
    "ty>=0.0.12",
    "black>=25.12.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "basedpyright>=1.37.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "sports_analytics"
registry_modules = [
    "sports_analytics.components.*",
]


